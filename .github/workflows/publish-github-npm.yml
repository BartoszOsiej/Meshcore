name: publish-github-npm

on:
  push:
    permissions:
      packages: write
    tags: ["v*"]
  workflow_dispatch:
    permissions:
      packages: write

permissions: read-all

jobs:
  publish:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@bartoszosiej"
      - run: npm install
      - run: |
          node -e "const p=require('./package.json');p.name='@bartoszosiej/'+p.name;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
