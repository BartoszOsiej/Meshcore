name: publish-github-npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@bartoszosiej"
      - run: npm install
      - run: |
          node -e "const p=require('./package.json');p.name='@bartoszosiej/'+p.name;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
